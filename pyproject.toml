[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-treasury-stream"
version = "0.1.0"
description = "Continuous algorithmic micro-streaming cashflows, compute bonding curves, and drawdown circuit breakers for autonomous AI agent swarms."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Lakshitha Dananjaya", email = "dananjayarox01@gmail.com" }
]
keywords = [
    "ai-agents",
    "autonomous-agents",
    "treasury",
    "streaming",
    "bonding-curves",
    "defi",
    "circuit-breaker",
    "mcp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
agent-treasury-stream = "agent_treasury_stream.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_treasury_stream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
